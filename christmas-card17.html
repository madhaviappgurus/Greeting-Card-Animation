<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --black: #000000;
            --white: #FFFFFF;
            --mid-light: #d02700;
            --deep-navy:#042C53;
            --base-light:#038377;
            --pale-ice-light:#f7fcff;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Spectral', serif;
        }

        .frame-scale {
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            transform: scale(0.02) rotateY(-160deg) skewX(10deg);
            perspective: 4200px;
            animation: frameScaleIn 2.5s ease forwards;
        }

        .frame-scale.visible {
            display: flex;
        }

        @keyframes frameScaleIn {
            0% {
                transform: scale(0.02) rotateY(-160deg) skewX(10deg);
                opacity: 0;
            }

            55% {
                opacity: 1;
            }

            100% {
                transform: scale(1) rotateY(0deg) skewX(0deg);
                opacity: 1;
            }
        }

        .main-wrap-frame {
            width: 1080px;
            height: 1800px;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }

        .video-wrap {
            position: absolute;
            inset: 0;
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        .video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .frame-scale {
            position: absolute;
            inset: 0;
            z-index: 2;
        }

        .frame {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--pale-ice-light);
            box-shadow: 0 120px 240px -75px rgba(0, 0, 0, 0.55);
            overflow: hidden;
            perspective: 4200px;
            transform: rotateY(-200deg);
            animation: cardFlipIn 2.2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .inner-frame {
            height: 100%;
            width: calc(100% - 80px);
            padding: 100px 0 60px;
            border: 1px solid var(--black);
            margin: 40px;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: column-reverse;
        }

        .logo-wrap {
            padding: 60px 0 0;
            border-top: 1px solid var(--black);
            width: calc(100% - 100px);
            text-align: center;
        }

        .textplay-logo {
            max-width: 360px;
            margin: 0 auto;
            text-align: center;
        }

        .head-desc-wrap {
            width: calc(100% - 100px);
            text-align: start;
        }

        @keyframes cardFlipIn {
            0% {
                transform: rotateY(-200deg);
            }

            100% {
                transform: rotateY(0deg);
            }
        }

        .frame::before {
            content: '';
            position: absolute;
            inset: 42px;
            pointer-events: none;
            z-index: 20;
        }

        .top-bday-frame {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        .curtains {
            position: absolute;
            z-index: 1;
            top: 0px;
            width: 420px;
        }

        .curtains.img-left {
            left: 0px;
        }

        .curtains.img-right {
            right: 0px;
        }

        .frame-img {
            display: block;
            width: calc(100% - 120px);
            margin: 0 auto;
        }

        .frame-img.two {
            width: calc(100% - 330px);
            transform: translateY(-48px);
        }

        .gift-frame {
            position: absolute;
            z-index: 2;
            bottom: 0;
            width: calc(100% - 73%);
            opacity: 0;
        }

        .gift-frame.img-left {
            left: -2px;
            transform: translateX(-180px);
            animation: giftFrameFadeLeft 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards;
        }

        .gift-frame.img-right {
            right: 0;
            transform: translateX(180px);
            animation: giftFrameFadeRight 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards;
        }

        @keyframes giftFrameFadeLeft {
            0% {
                opacity: 0;
                transform: translateX(-180px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes giftFrameFadeRight {
            0% {
                opacity: 0;
                transform: translateX(180px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .gift-bottom {
            position: absolute;
            bottom: 0;
            margin: 0 auto;
            text-align: center;
            height: auto;
            width: 600px;
            right: 0;
            left: 0;
            opacity: 0;
            transform: translateY(240px);
            animation: giftBottomFadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards;
        }

        @keyframes giftBottomFadeUp {
            0% {
                opacity: 0;
                transform: translateY(240px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .book-page {
            position: absolute;
            inset: 0;
            z-index: 15;
            background: var(--cream);
            transform-origin: 0% 50%;
            backface-visibility: hidden;
            box-shadow: 30px 0 102px -36px rgba(0, 0, 0, 0.4);
            animation: pageTurn 3.0s cubic-bezier(0.45, 0, 0.15, 1) 3.4s forwards;
        }

        .book-page::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 60px;
            background: linear-gradient(90deg, rgba(59, 42, 69, 0.1), transparent);
            z-index: 2;
        }

        .book-page::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.18) 55%, rgba(0, 0, 0, 0.4) 100%);
            opacity: 0;
            animation: curlShade 3.3s ease 3.4s forwards;
        }

        @keyframes pageTurn {
            0% {
                transform: rotateY(0deg);
            }

            100% {
                transform: rotateY(-172deg);
            }
        }

        @keyframes curlShade {
            0% {
                opacity: 0;
            }

            45% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .book-page.done {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .cover-face {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .cover-face::before {
            background: url("./images/hb-bg-pattern.png") center / cover no-repeat;
            content: "";
            inset: 0;
            position: absolute;
            z-index: -1;
            opacity: .3;
        }

        .confetti {
            position: absolute;
            opacity: 0.5;
            animation: drift 9s ease-in-out infinite;
        }

        @keyframes drift {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-42px) rotate(20deg);
            }
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 108px 78px;
            position: relative;
        }

        .content::before {
            background: url("./images/hb-bg-pattern.png") center / cover no-repeat;
            content: "";
            inset: 0;
            position: absolute;
            z-index: -1;
            opacity: .3;
        }

        .headline {
            font-family: 'Spectral', serif;
            font-weight: 700;
            font-size: 8rem;
            color: var(--mid-light);
            line-height: 1.15;
            margin-bottom: 0;
            text-align: start;
        }

        .hb-text {
            text-align: start;
            height: 290px;
            margin: 0;
        }

        .headline .letter {
            display: inline-block;
            vertical-align: bottom;
            opacity: 0;
            transform: translate3d(0, 36px, 0);
            will-change: transform, opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            animation: letterIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .headline .word-gap {
            display: inline-block;
            width: 0.28em;
        }

        .headline .word-christmas {
            color: var(--deep-navy);
        }

        .headline .word {
            display: inline-block;
        }

        @keyframes letterIn {
            0% {
                opacity: 0;
                transform: translate3d(0, 36px, 0);
            }

            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        .divider {
            opacity: 0;
            animation: fadeSimple 0.8s ease forwards;
        }

        @keyframes fadeSimple {
            to {
                opacity: 1;
            }
        }

        .wish-panel {
            position: relative;
            text-align: start;
            width: 100%;
            max-width: 860px;
            min-height: 600px;
            background: none;
            box-shadow: none;
            padding: 66px 0;
            overflow: visible;
        }

        .wish-wrap {
            width: 100%;
            height: 100%;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0;
            }

            50% {
                opacity: 0.7;
            }
        }

        .wish {
            position: relative;
            font-family: 'Alex Brush', cursive;
            font-size: 52px;
            line-height: 1.5;
            color: var(--base-light);
            margin: 0;
            text-align: start;
        }

        .wish .word {
            display: inline-block;
            padding: 0 6px;
        }

        .wish .letter {
            display: inline-block;
            opacity: 0;
            filter: blur(12px);
            transform: scale(1.5);
            text-shadow: 0 0 18px rgba(3, 131, 119, 0.9), 0 0 42px rgba(3, 131, 119, 0.6);
            animation: inkIn 0.65s ease forwards;
        }

        @keyframes inkIn {
            0% {
                opacity: 0;
                filter: blur(12px);
                transform: scale(1.5);
            }

            55% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
                text-shadow: 0 0 9px rgba(3, 131, 119, 0.35), 0 0 24px rgba(3, 131, 119, 0.35);
            }
        }

        .spark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 115px;
            transform: translate(-50%, -50%) rotate(-28deg);
            transform-origin: 50% 50%;
            filter: drop-shadow(0 0 15px rgba(3, 131, 119, 0.85)) drop-shadow(0 0 30px rgba(3, 131, 119, 0.5));
            pointer-events: none;
            opacity: 0;
            transition: left 0.14s ease-out, top 0.14s ease-out, opacity 0.6s ease;
        }

        .spark svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        @media (prefers-reduced-motion:reduce) {

            .frame-scale,
            .frame,
            .confetti,
            .gift-frame,
            .gift-bottom {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }

            .wish .letter {
                animation: none !important;
                opacity: 1 !important;
                filter: none !important;
                transform: none !important;
            }

            .spark {
                display: none !important;
            }

            .book-page,
            .book-page::after {
                animation: none !important;
                opacity: 0 !important;
            }
        }

        /* End of styling */
    </style>
</head>

<body>
    <div class="main-wrap-frame">
        <div class="video-wrap">
            <video muted autoplay playsinline>
                <source src="./images/V3.mp4" type="video/mp4">
            </video>
        </div>

        <div class="frame-scale" id="frameScale">
            <div class="frame" id="frame">
                <div class="inner-frame">
                    <div class="logo-wrap">
                        <img src="./images/textplay-logo.png" class="textplay-logo" alt="logo">
                    </div>
                    <div class="head-desc-wrap">
                        <div class="hb-text">
                            <h1 class="headline" id="headline"></h1>
                        </div>
                        <div class="wish-panel" id="wishPanel">
                            <div class="wish-wrap">
                                <p class="wish" id="wish">
                                </p>
                            </div>
                            <div class="spark" id="spark">
                                <svg viewBox="0 0 50 115px" xmlns="http://www.w3.org/2000/svg">
                                    <defs>
                                        <linearGradient id="quillGrad2" x1="0" y1="0" x2="1" y2="1">
                                            <stop offset="0" stop-color="var(--base-light)"></stop>
                                            <stop offset="1" stop-color="var(--base-light)"></stop>
                                        </linearGradient>
                                    </defs>
                                    <path
                                        d="M30 4 C 52 20 56 62 40 100 C 33 116 18 126 8 138 C 5 118 3 96 10 78 C 1 58 4 28 30 4 Z"
                                        fill="url(#quillGrad2)" stroke="var(--base-light)" stroke-width="1.2">
                                    </path>
                                    <path d="M30 6 L 9 132" stroke="var(--base-light)" stroke-width="1" opacity="1">
                                    </path>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="book-page" id="bookPage">
                    <div class="cover-face">
                        <img src="./images/christmas-card17.png" class="frame-image" alt="Image">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fadeReveal(
            container,
            text,
            {
                startDelay = 0,
                letterDelay = 0.07,
                wordClassMap = {}
            } = {}
        ) {
            if (!container) {
                return startDelay;
            }

            container.innerHTML = '';

            const words = text.split(' ');
            let elapsed = startDelay;

            words.forEach((word, wIndex) => {
                const wordWrap = document.createElement('span');
                wordWrap.className = 'word';

                const wordClass =
                    wordClassMap[word.toLowerCase()] || '';

                [...word].forEach(ch => {
                    const span = document.createElement('span');

                    span.className =
                        'letter' +
                        (wordClass ? ' ' + wordClass : '');

                    span.textContent = ch;

                    span.style.animationDelay =
                        elapsed.toFixed(3) + 's';

                    wordWrap.appendChild(span);

                    elapsed += letterDelay;
                });

                container.appendChild(wordWrap);

                if (wIndex < words.length - 1) {
                    const br = document.createElement('br');

                    container.appendChild(br);

                    elapsed += letterDelay;
                }
            });

            return elapsed;
        }


        function inkWriter(
            panel,
            textEl,
            sparkEl,
            text,
            {
                startDelay = 0,
                charDelay = 70
            } = {}
        ) {
            if (!panel || !textEl || !sparkEl) {
                return;
            }

            textEl.innerHTML = '';

            sparkEl.classList.remove('d-none');
            sparkEl.classList.remove('writing');
            sparkEl.style.opacity = '0';

            const words = text.split(' ');

            let wordIndex = 0;
            let charIndex = 0;
            let currentWord = null;


            function positionSparkOn(span) {
                if (!span || !panel || !sparkEl) {
                    return;
                }

                const panelRect =
                    panel.getBoundingClientRect();

                const charRect =
                    span.getBoundingClientRect();

                const targetLeft =
                    charRect.right -
                    panelRect.left -
                    12;

                const targetTop =
                    charRect.bottom -
                    panelRect.top -
                    129;

                sparkEl.style.left =
                    targetLeft + 'px';

                sparkEl.style.top =
                    targetTop + 'px';

                sparkEl.style.opacity = '1';

                sparkEl.classList.add('writing');
            }


            function finishWriting() {
                sparkEl.classList.remove('writing');

                setTimeout(() => {
                    sparkEl.style.opacity = '0';

                    setTimeout(() => {
                        sparkEl.classList.add('d-none');
                    }, 650);
                }, 300);
            }


            function step() {
                if (wordIndex >= words.length) {
                    finishWriting();
                    return;
                }

                const word = words[wordIndex];

                if (charIndex === 0) {
                    currentWord =
                        document.createElement('span');

                    currentWord.className = 'word';

                    textEl.appendChild(currentWord);
                }

                const ch =
                    word.charAt(charIndex);

                const span =
                    document.createElement('span');

                span.className = 'letter';
                span.textContent = ch;

                currentWord.appendChild(span);

                positionSparkOn(span);

                charIndex++;

                if (charIndex >= word.length) {
                    wordIndex++;
                    charIndex = 0;

                    setTimeout(() => {
                        sparkEl.classList.remove('writing');
                        step();
                    }, charDelay * 1.15);

                } else {
                    const pause =
                        /[.,!?]/.test(ch)
                            ? charDelay * 4
                            : charDelay;

                    setTimeout(step, pause);
                }
            }

            setTimeout(step, startDelay);
        }


        const bookPage = document.getElementById('bookPage');
        const headline = document.getElementById('headline');
        const divider = document.getElementById('divider');
        const wishPanel = document.getElementById('wishPanel');
        const wish = document.getElementById('wish');
        const spark = document.getElementById('spark');
        const giftBottom = document.getElementById('giftBottom');


        const WISH_START_DELAY_MS = 4400;

        function startInsideContent() {

            if (headline) {
                fadeReveal(
                    headline,
                    'Marry Christmas',
                    {
                        startDelay: 0,
                        letterDelay: 0,
                        wordClassMap: {
                            birthday: 'word-christmas'
                        }
                    }
                );
            }

            if (wishPanel && wish && spark) {
                inkWriter(
                    wishPanel,
                    wish,
                    spark,
                    'This season, may your home be filled with love, your heart with peace, and your days with joy. Merry Christmas to you and yours',
                    {
                        startDelay: 0,
                        charDelay: 90
                    }
                );
            }
        }

        function startBirthdayAnimation() {
            if (bookPage) {
                bookPage.classList.add('done');
            }

            startInsideContent();
        }


        const frameScale = document.getElementById('frameScale');
        const video = document.querySelector('.video-wrap video');

        let frameRevealed = false;

        function revealFrameScale() {
            if (frameRevealed) return;
            frameRevealed = true;

            if (frameScale) {
                // Reset the animation so it plays fresh from the moment of reveal
                frameScale.style.animation = 'none';
                // Force reflow to restart animation
                void frameScale.offsetWidth;
                frameScale.style.animation = '';
                frameScale.classList.add('visible');
            }

            if (bookPage) {
                setTimeout(
                    startBirthdayAnimation,
                    WISH_START_DELAY_MS
                );
            } else {
                startBirthdayAnimation();
            }
        }

        if (video) {
            video.addEventListener('timeupdate', function () {
                if (!frameRevealed && video.currentTime >= 6.5) {
                    revealFrameScale();
                }
            });
        } else {
            // Fallback: no video element found, reveal immediately
            revealFrameScale();
        }
    </script>

</body>

</html>
